name: Home collector
version: "1.0.49"
slug: home_collector
description: Sends allowlisted Home Assistant states to theleases.org, and plays, pauses and skips on the Sonos speakers it is told to.
url: https://theleases.org/
arch:
  - aarch64
  - amd64
  - armv7
startup: application
boot: auto
init: false
# Core's REST API through the Supervisor proxy (http://supervisor/core/api) with SUPERVISOR_TOKEN. Nothing else is asked for:
# no host network, no ports, no hassio_api, no file shares (until 1.0.48, below: the media folder, read only). 1.0.32 (R-0517): the same access also calls five media_player
# actions (play_media, media_pause, media_play, media_next_track, volume_set) on the speakers in sonos_speakers, and nothing else.
# 1.0.33 (R-0517 4.1, 4.2): it also reads those speakers' states (GET /states/<entity>) to tell the site what each one is playing,
# and groups them with media_player.join (group_members from the same list) and media_player.unjoin.
# 1.0.39 (R-0035 1.3): it also calls scene.turn_on on the scenes in guest_scenes, and reads the presence entities in entities
# before the All off scene. Nothing else.
# 1.0.42 (R-0588 1.1): it also calls script.turn_on on the scripts in family_scenes, and reads Home Assistant's states list
# (GET /states) to tell the site, for each guest scene, only whether its lights are on.
# 1.0.44 (R-0588 3.1): the same read also counts, for each guest scene, how many of its lights are on and of how many (counts
# only, never names or entity ids), so the site can say Partly on. No new call.
# 1.0.45 (R-0633 1.3): one template call, hourly, lists the entities and devices on Home Assistant labels whose ids start with
# plant_ (one label per plant spot), to send each spot's temperature, humidity, battery and grow-light plug. No new call.
# 1.0.46 (R-0320 6.2): a new kind, frigate (Frigate's detector speed and CPU, numbers only), and a camera Home Assistant says is
# unavailable is sent as offline. No new call.
# 1.0.47 (R-0473 2.1): the TV job also sends each show's season counts from the same Sonarr series read. No new call.
# 1.0.48 (R-0568 2.3, the owner picked option A 11/28/26): the first file share, Home Assistant's media folder, READ ONLY, for Send
# to Kobo. The add-on reads one book file the owner asked for, and only under kobo_books_dir (the NAS books share Home Assistant
# mounts as Network Storage, Media, named books): an EPUB, KEPUB or PDF of at most 50 MB, checked after resolving links. It
# never writes, lists or deletes there, and sends no path to the site.
# 1.0.49 (R-0010 3.1): a new kind, irrigation: the Rachio sprinkler zones, standby, rain delay and rain sensor, on or off, from the
# same states read. No new call.
homeassistant_api: true
map:
  - media:ro
options:
  push_url: ""
  poll_seconds: 15
  entities: []
  # Every light.* entity is watched as kind light (on or off, and its area), besides the list above. Light groups are skipped.
  all_lights: true
  # Every power (W) and energy (kWh) sensor, by device, as 5-minute buckets for the Energy page's Devices (R-0416). Words in
  # power_exclude skip a sensor whose entity id or name holds one. Tesla's own solar, grid and Powerwall sensors are never devices.
  # Every washer, dryer, dishwasher, oven, range, microwave, fridge and freezer status entity, water heater and vacuum, as kind
  # appliance (running, idle, off, paused, done), with its room and minutes left when its device reports them. At most 30.
  all_appliances: true
  # 1.0.45 (R-0633): every entity or device on a plant_ label (one label per plant spot, such as "Plant garage greenhouse"), as
  # kind plant: its temperature, humidity and battery sensors and its grow-light plug on or off, for the Plants page.
  all_plants: true
  # 1.0.49 (R-0010 3.1): every Rachio entity (switch.rachio_*, binary_sensor.rachio_*, and any switch with a zone_number) as kind
  # irrigation, on or off: each zone, standby, rain delay and the rain sensor, for Water's Sprinklers tab. Schedules are left out.
  all_irrigation: true
  all_power: true
  power_exclude: []
  # Words that mark a device's watts as estimated (a listed wattage) or measured (a real plug), whatever the add-on works out.
  power_estimated: []
  power_measured: []
  # Optional extra jobs (collector.py JOBS). Blank skips the job. These stay on this machine and are never sent to the site.
  radarr_url: ""
  radarr_key: ""
  radarr_profile: ""
  radarr_root: ""
  plex_url: ""
  plex_token: ""
  sonarr_url: ""
  sonarr_key: ""
  # 1.0.41 (R-0568 0.2): Bookshelf (a Readarr fork, Readarr v1 API) for the site's books, read only, and the owner's adds. Blank skips
  # it. The profile and metadata profile are Bookshelf's ids (1: "EPUB only" and "Standard"); the root is where an added book goes.
  bookshelf_url: ""
  bookshelf_key: ""
  bookshelf_profile: 1
  bookshelf_metadata_profile: 1
  bookshelf_root: "/books"
  # 1.0.48 (R-0568 2.3): where the NAS books share appears inside the add-on (Home Assistant's Network Storage, Media, named books,
  # shows as /media/books). A Bookshelf path under bookshelf_root is read here instead, read only, for Send to Kobo. Blank: off.
  kobo_books_dir: "/media/books"
  # The home theater's media_player (the Apple TV), for the poster screen's Now showing (R-0018 3.4). Blank: off.
  poster_player: ""
  # The owner's Plex account id, for their Plex music plays in the Listening log (R-0018 3.5) and their album covers (1.0.18, R-0447). Blank sends none.
  plex_account_id: ""
  # Every router client (ASUSWRT device_tracker entities, source_type router) every 15 minutes, for the site's network list (R-0164).
  all_router_clients: true
  # 1.0.30: the house LAN's first three parts (such as 10.0.0), a private range (10, 172.16 to 172.31, 192.168; 1.0.31). A router client's address is sent only inside it; blank sends none.
  lan_prefix: ""
  # 1.0.19 (R-0448): every motion or occupancy binary_sensor (never a battery one) and every timer.*_motion_off, for Energy's Motion card.
  all_motion: true
  # 1.0.20 (R-0451): the Plex music library (artists, albums, tracks: names, years, genres, play counts, format and bitrate, never a
  # file path) once a day and when Plex says a music section changed, for Listening's Library tab. Needs plex_url and plex_token.
  music_library: true
  # 1.0.20 (R-0453): the wake-up routine's helpers, posted when one changes: its stage (an input_text), whether it runs (an
  # input_boolean) and, optionally, when its log line (an input_text) changed, never its words. 1.0.30: named here, blank is off.
  wake_up: true
  wake_stage: ""
  wake_active: ""
  wake_log: ""
  # 1.0.32 (R-0517): the Sonos speakers the site may play, pause, skip and set the volume on, through Home Assistant's Sonos
  # integration, over one outbound WebSocket to the site (no port opened). Each is a media_player entity id and the name the site
  # shows; blank (the default) keeps the link off. Plex albums also need plex_url and plex_token, and the speakers linked to Plex.
  sonos_speakers: []
  # 1.0.39 (R-0035 1.3): the guest light scenes the site's Lights page may turn on, over the same link. Each is a Home Assistant
  # scene entity and the name the page shows; mark the one interior All off scene with all_off: true, and it runs only when every
  # presence entity in the entities list reads away (anyone home, or a presence entity unknown, is refused). Blank keeps them off.
  # The site sends a scene's place in this list, never an entity id, and the only call is scene.turn_on.
  guest_scenes: []
  # 1.0.42 (R-0588 1.1): the family looks the Lights page offers the owner and household (never guests), at most 4. Each is a
  # Home Assistant script entity (script.look_low_light) and the name the page shows (Low light). The site sends a place in this
  # list, never an entity id, and the only call is script.turn_on. Blank keeps them off.
  family_scenes: []
  # The Powerwall gateway's live readings (1.0.14, R-0416 5.2) are found by themselves: from Home Assistant's Tesla Powerwall
  # integration, or with none (1.0.15) from sensors named sensor.powerwall_* and sensor.tesla_* (REST sensors from a gateway app).
  # Only when the Log tab says a reading is ambiguous or missing, name its sensor here (an entity id, kept on this machine).
  # The signs are taken as they are: battery above zero discharging, grid above zero drawn from the grid.
  powerwall_house: ""
  powerwall_solar: ""
  powerwall_battery: ""
  powerwall_grid: ""
  powerwall_charge: ""
  # 1.0.15: the grid up or down binary_sensor (on: the grid is up), found by "grid" and "connected" in its id or name.
  powerwall_grid_connected: ""
schema:
  push_url: url
  poll_seconds: int(5,300)
  all_lights: bool?
  all_appliances: bool?
  all_plants: bool?
  all_irrigation: bool?
  all_power: bool?
  all_router_clients: bool?
  all_motion: bool?
  music_library: bool?
  wake_up: bool?
  wake_stage: str?
  wake_active: str?
  wake_log: str?
  lan_prefix: str?
  power_exclude:
    - str
  power_estimated:
    - str
  power_measured:
    - str
  radarr_url: str?
  radarr_key: password?
  radarr_profile: str?
  radarr_root: str?
  plex_url: str?
  plex_token: password?
  sonarr_url: str?
  sonarr_key: password?
  bookshelf_url: str?
  bookshelf_key: password?
  bookshelf_profile: int(1,)?
  bookshelf_metadata_profile: int(1,)?
  bookshelf_root: str?
  kobo_books_dir: str?
  poster_player: str?
  plex_account_id: str?
  powerwall_house: str?
  powerwall_solar: str?
  powerwall_battery: str?
  powerwall_grid: str?
  powerwall_charge: str?
  powerwall_grid_connected: str?
  sonos_speakers:
    - entity: str
      name: str?
  guest_scenes:
    - entity: str
      name: str?
      all_off: bool?
  family_scenes:
    - entity: str
      name: str?
  entities:
    - entity: str
      kind: list(door|sensor|presence|battery|device_online|media|nas|ups|router_client|light|printer|lock|camera|alarm|garage|appliance|smoke|climate|water_heater|frigate|irrigation)
